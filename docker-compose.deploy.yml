version: '3.8'

services:

  mysql:
    image: mysql:8.4
    container_name: finance-mysql
    restart: always

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-financedb}
      MYSQL_USER: ${MYSQL_USER:-finance_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-finance_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-root_pass}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - finance-net


  backend:
    image: kittuuu/personal-finance-backend:latest
    container_name: finance-backend
    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-financedb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-finance_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-finance_pass}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SERVER_PORT: 8080

    ports:
      - "8080:8080"

    networks:
      - finance-net


  frontend:
    image: kittuuu/personal-finance-frontend:latest
    container_name: finance-frontend
    restart: always

    depends_on:
      - backend

    ports:
      - "80:80"
      - "3000:80"

    networks:
      - finance-net


volumes:
  mysql_data:


networks:
  finance-net:
    driver: bridge